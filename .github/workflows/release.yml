name: Release image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: decap_oauth:smoke

      - name: Smoke test
        run: |
          docker run --rm -d --name decap_oauth -p 3005:3005 \
            -e OAUTH_CLIENT_ID=smoke \
            -e OAUTH_SECRET=smoke \
            -e OAUTH_ORIGINS=localhost:3005 \
            decap_oauth:smoke
          for _ in $(seq 1 20); do
            if curl -fsS -o /dev/null -H 'Host: localhost:3005' http://127.0.0.1:3005/auth; then
              exit 0
            fi
            sleep 0.5
          done
          docker logs decap_oauth
          exit 1

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
